version: '3.8'

services:
  fastapi:
    build:
      context: ./src/api
    container_name: fastapi
    volumes:
      - ./best_model.pkl:/best_model.pkl
      - ./column_transformer.pkl:/column_transformer.pkl
    ports:
      - "8000:8000"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboard:/etc/grafana/provisioning/dashboards.yml
    depends_on:
      - prometheus
    networks:
      - monitoring


networks:
  monitoring:

volumes:
  grafana-storage:

